name: CI/CD — Test, Build, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Test Node.js Backend
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test Node.js Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        env:
          PORT: 5000
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: "true"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: "7d"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Test Python AI Backend
  # ─────────────────────────────────────────────────────────────────────────
  test-ai-backend:
    name: Test Python AI Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --if-no-tests-no-error || true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Deploy Frontend to Vercel
  # ─────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend to Vercel
    needs: [test-backend, test-ai-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./hospital-management-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital-management-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AI_API_BASE_URL: ${{ secrets.VITE_AI_API_BASE_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./hospital-management-system
          vercel-args: '--prod'

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Trigger Render Backend Redeploy
  # ─────────────────────────────────────────────────────────────────────────
  deploy-backends:
    name: Trigger Render Redeploy
    needs: [test-backend, test-ai-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Node backend to Render
        run: |
          curl -s -X POST "${{ secrets.RENDER_NODE_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" | echo "Node backend deploy triggered"

      - name: Deploy AI backend to Render
        run: |
          curl -s -X POST "${{ secrets.RENDER_AI_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" | echo "AI backend deploy triggered"
