<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CareInFlow.co</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fc;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 7%;
            background: #0d6efd;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .forgot-section {
            min-height: 78vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-icon {
            font-size: 50px;
        }

        .forgot-header h1 {
            margin: 10px 0;
            color: #123;
        }

        .forgot-header p {
            color: #777;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #0b5ed7;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            background: #111827;
            color: white;
            padding: 25px;
        }

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .forgot-container {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🏥 CareInFlow.co
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="doctor.html">
                Doctors
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- FORGOT PASSWORD -->

    <section class="forgot-section">

        <div class="forgot-container">


            <div class="forgot-header">

                <div class="forgot-icon">
                    🔐
                </div>

                <h1>
                    Forgot Password?
                </h1>

                <p>
                    Enter your email address and
                    we will help you reset your password.
                </p>

            </div>


            <!-- FORM -->

            <form id="forgotForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="reset-btn"
                >
                    Send Reset Link
                </button>


                <p
                    id="message"
                    class="message"
                ></p>


            </form>


            <!-- BACK TO LOGIN -->

            <div class="back-login">

                <p>

                    Remember your password?

                    <a href="login.html">
                        Back to Login
                    </a>

                </p>

            </div>


        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <h3>
            CareInFlow.co
        </h3>

        <p>
            Your health is our priority.
        </p>

        <p>
            © 2026 CareInFlow.co
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        const forgotForm =
            document.getElementById("forgotForm");


        forgotForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();


                const message =
                    document.getElementById("message");


                if (email === "") {

                    message.textContent =
                        "Please enter your email address.";

                    message.style.color =
                        "red";

                    return;

                }


                message.textContent =
                    "Password reset link sent successfully!";

                message.style.color =
                    "green";


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1500);

            }
        );

    </script>


</body>

</html>
