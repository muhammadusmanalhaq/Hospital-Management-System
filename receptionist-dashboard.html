<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center text-warning mb-4">
        Receptionist Dashboard
    </h1>

    <div class="row">

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>New Patients</h5>
                    <h2>32</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Today's Appointments</h5>
                    <h2>28</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Bills Generated</h5>
                    <h2>15</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Patient Inquiries</h5>
                    <h2>10</h2>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-5">

    <h3>Today's Patients</h3>

    <table class="table table-bordered table-hover mt-3">
        <thead class="table-warning">
            <tr>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Appointment Time</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Ahmed Ali</td>
                <td>Dr. Sara</td>
                <td>09:00 AM</td>
                <td>Checked In</td>
            </tr>

            <tr>
                <td>Fatima Khan</td>
                <td>Dr. Ali</td>
                <td>10:30 AM</td>
                <td>Waiting</td>
            </tr>

            <tr>
                <td>Usman Tariq</td>
                <td>Dr. Ahmed</td>
                <td>11:15 AM</td>
                <td>Completed</td>
            </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net
