<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center text-success mb-4">
        Doctor Dashboard
    </h1>

    <div class="row">

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Today's Patients</h5>
                    <h2>18</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Appointments</h5>
                    <h2>12</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Prescriptions</h5>
                    <h2>35</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h5>Medical Reports</h5>
                    <h2>20</h2>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-5">

    <h3>Today's Appointments</h3>

    <table class="table table-striped table-bordered mt-3">
        <thead class="table-success">
            <tr>
                <th>Patient Name</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ali Khan</td>
                <td>09:00 AM</td>
                <td>Waiting</td>
            </tr>

            <tr>
                <td>Fatima Ahmed</td>
                <td>10:30 AM</td>
                <td>Completed</td>
            </tr>

            <tr>
                <td>Usman Tariq</td>
                <td>11:30 AM</td>
                <td>Pending</td>
            </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
